services:
  postgres:
    image: postgres:17-alpine
    container_name: chagok-erp-postgres
    environment:
      POSTGRES_DB: chagok_erp
      POSTGRES_USER: chagok
      POSTGRES_PASSWORD: chagok-local
    ports:
      - "5432:5432"
    volumes:
      - chagok_erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chagok -d chagok_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chagok_erp_postgres:
